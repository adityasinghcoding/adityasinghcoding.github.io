name: Deploy Portfolio to GitHub Pages

on:
  push:
    branches:
      - main  # your private repo default branch

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout private repo code
        uses: actions/checkout@v3

      # If you have a build step, uncomment and edit these lines:
      - name: Install dependencies
        run: npm install
      
      - name: Build website
        run: npm run build

      - name: Deploy to GitHub Pages public repo
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git clone https://x-access-token:${{ secrets.PAT_TOKEN }}@github.com/adityasinghcoding/adityasinghcoding.github.io.git public_repo
          rm -rf public_repo/*
          cp -r ./public/* public_repo/  # Adjust './public/' to your built site folder or root if static files
          cd public_repo
          git add .
          git commit -m "Deploy portfolio site"
          git push origin main
