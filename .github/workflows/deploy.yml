name: Deploy Static Site to GitHub Pages

on:
  push:
    branches:
      - main  # or your default branch name

permissions:
  contents: write  # to allow pushing to gh-pages branch or deployment

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    # If you have a build step, add it here, e.g., for React or Hugo
    # - name: Build Site
    #   run: npm run build

    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./  # change to your build output directory if any
